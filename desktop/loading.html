<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Recruence</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #12243d;
      background: radial-gradient(1200px 600px at 20% 10%, #d6e9ff 0%, transparent 60%), radial-gradient(900px 500px at 90% 90%, #e3f0ff 0%, transparent 60%), #eaf4ff; }
    .card { display: grid; justify-items: center; gap: 14px; padding: 40px 56px; border-radius: 24px; background: rgba(255, 255, 255, .55);
      border: 1px solid rgba(255, 255, 255, .8); box-shadow: 0 20px 60px rgba(30, 80, 160, .12); backdrop-filter: blur(18px); }
    .card img { width: 120px; height: 120px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
    p { margin: 0; color: #4b6280; }
    .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(47, 124, 246, .2); border-top-color: #2f7cf6; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    .titlebar { position: fixed; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 12px;
      background: #f6faff; border-bottom: 1px solid rgba(52, 127, 234, .15); font-size: 12px; color: #4b6280;
      -webkit-app-region: drag; user-select: none; }
    .titlebar img { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="titlebar"><img src="icon.png" alt=""><span>Recruence</span></div>
  <div class="card" role="status" aria-live="polite">
    <img src="icon.png" alt="">
    <h1>Recruence</h1>
    <div class="spin" aria-hidden="true"></div>
    <p>Starting…</p>
  </div>
</body>
</html>
